<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Shipment details</title>
</head>
<body>

<p>
    <a th:href="@{/web/shipments/list}">← Back to shipments</a>
</p>

<h1>Shipment details</h1>

<p id="error" style="color:red;" th:if="${error}" th:text="${error}"></p>

<p>
    <b>ID:</b> <span id="shipment-id" th:text="${shipment.id}">1</span><br/>
    <b>Start:</b> <span id="shipment-start-date"
                        th:text="${shipment.startDate != null ? shipment.startDate : '-'}">-</span><br/>
    <b>End:</b> <span id="shipment-end-date"
                      th:text="${shipment.endDate != null ? shipment.endDate : '-'}">-</span><br/>
    <b>Description:</b>
    <span id="shipment-description" th:text="${(shipment.description != null && !#strings.isEmpty(shipment.description))
                    ? shipment.description : '-'}">-</span><br/>
    <b>Current state: </b>
    <span id="shipment-status" th:text="${shipment.state}">CREATED</span>
</p>

<!-- ========================= -->
<!-- TRACKING STATE             -->
<!-- ========================= -->

<!-- Se NON è finale -->
<div style="border:1px solid #ddd; padding:12px; margin:16px 0; border-radius:8px;">

    <h2 style="margin:0 0 8px 0;">TrackingState</h2>

    <p style="margin:0;">
        <span th:if="${shipment.isFinalState()}">Final shipment: tracking cannot be modified.</span><br/>
        <span>Tracking state: </span>
        <b id="shipment-tracking-state" th:text="${trackingState}"></b>
    </p>

    <div th:if="${!shipment.isFinalState()}" style="display:flex; gap:10px; margin: 5px 0 0 0;">
        <form method="post" th:action="@{/web/shipments/{id}/tracking/activate(id=${shipment.id})}">
            <input id="activate-btn" type="submit" value="Activate"/>
        </form>

        <form method="post" th:action="@{/web/shipments/{id}/tracking/deactivate(id=${shipment.id})}">
            <input id="deactivate-btn" type="submit" value="Deactivate"/>
        </form>
    </div>
</div>

<!-- ========================= -->
<!-- TRACKABLES                 -->
<!-- ========================= -->

<h2>Trackables</h2>

<table id="trackable-table" th:border="1" th:cellpadding="6"
       th:if="${shipment.trackables != null && !#lists.isEmpty(shipment.trackables)}">
    <thead>
    <tr>
        <th>Type</th>
        <th>ID</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${shipment.trackables}">
        <td th:text="${t.getClass().getSimpleName()}">Trackable</td>
        <td th:text="${t.id}">1</td>
        <td th:text="${(t.description != null && !#strings.isEmpty(t.description))
                        ? t.description : '-'}">-
        </td>
    </tr>
    </tbody>
</table>

<p id="no-trk-msg" th:if="${shipment.trackables == null || #lists.isEmpty(shipment.trackables)}">
    No trackables in this shipment.
</p>

</body>
</html>
