<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Edit Shipment</title>
</head>
<body>

<h1>Edit Shipment</h1>

<!-- ERROR MESSAGE -->
<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>

<form th:action="@{/web/shipments/{id}/edit(id=${shipment.id})}" method="post">

    <p>
        <b>Shipment ID:</b>
        <span th:text="${shipment.id}">1</span>
    </p>

    <p>
        <label>Description:</label>
        <label>
            <input type="text"
                   name="description"
                   maxlength="240"
                   th:value="${shipment.description}" />
        </label>
    </p>

    <!-- ================= UNIT LOADS ================= -->

    <h2>UnitLoads</h2>

    <table th:border="1" th:cellpadding="6">
        <thead>
        <tr>
            <th>Select</th>
            <th>ID</th>
            <th>Description</th>
            <th>Physical constraints</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="ul : ${unitLoadsToShow}">
            <td>
                <label>
                    <input type="checkbox"
                           name="unitLoadIds"
                           th:value="${ul.id}"
                           th:checked="${selectedUnitLoadIds != null and selectedUnitLoadIds.contains(ul.id)}" />
                </label>
            </td>

            <td th:text="${ul.id}">1</td>
            <td th:text="${ul.description != null ? ul.description : '-'}">desc</td>
            <td th:text="${ul.physicalConstraints == null ? 0 : ul.physicalConstraints.size()}">0</td>
        </tr>

        <tr th:if="${unitLoadsToShow == null or unitLoadsToShow.isEmpty()}">
            <td colspan="4">No UnitLoads.</td>
        </tr>
        </tbody>
    </table>

    <!-- ================= PACKAGES ================= -->

    <h2>Packages</h2>

    <table th:border="1" th:cellpadding="6">
        <thead>
        <tr>
            <th>Select</th>
            <th>ID</th>
            <th>Description</th>
            <th>UnitLoad(s)</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="pkg : ${packagesToShow}">
            <td>
                <label>
                    <input type="checkbox"
                           name="packageIds"
                           th:value="${pkg.id}"
                           th:checked="${selectedPackageIds != null and selectedPackageIds.contains(pkg.id)}" />
                </label>
            </td>

            <td th:text="${pkg.id}">1</td>
            <td th:text="${pkg.description != null ? pkg.description : '-'}">desc</td>

            <!-- NUMBER OF UNIT LOADS IN PACKAGE -->
            <td>
                <span th:if="${pkg.unitLoads == null or pkg.unitLoads.isEmpty()}">-</span>
                <span th:if="${pkg.unitLoads != null and not pkg.unitLoads.isEmpty()}"
                      th:text="${pkg.unitLoads.size()}">0</span>
            </td>
        </tr>

        <tr th:if="${packagesToShow == null or packagesToShow.isEmpty()}">
            <td colspan="4">No Packages.</td>
        </tr>
        </tbody>
    </table>

    <!-- ================= ACTIONS ================= -->

    <p style="margin-top:16px;">
        <button type="submit">Save</button>
        <a th:href="@{/web/shipments/list}">
            <button type="button">Cancel</button>
        </a>
    </p>

</form>

</body>
</html>
