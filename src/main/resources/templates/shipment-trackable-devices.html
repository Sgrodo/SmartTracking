<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Trackables & Devices</title>
</head>
<body>

<p>
    <a th:href="@{/web/shipments/list}">← Back to shipments</a>
    | <a th:href="@{/web/shipments/{id}(id=${shipment.id})}">Shipment details</a>
</p>

<h1>Trackables & Devices</h1>

<p style="margin-top:-10px;">
    <small>
        Shipment ID: <span th:text="${shipment.id}">1</span>
        <span th:if="${shipment.description != null and not #strings.isEmpty(shipment.description)}">
            | <span th:text="${shipment.description}">desc</span>
        </span>
    </small>
</p>

<p th:if="${error != null}" th:text="${error}" style="color:red;"></p>

<div th:each="t : ${trackables}" style="margin-bottom:30px;">
    <h3>Trackable <span th:text="${t.id}">1</span></h3>

    <table th:border="1" th:cellpadding="6">
        <thead>
        <tr>
            <th>Device ID</th>
            <th>Origin</th>
            <th>Connected</th>
            <th>Calibrated</th>
            <th>State</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody th:with="as=${assignmentsByTrackableId.get(t.id)}">

        <!-- no active assignments -->
        <tr th:if="${as == null or #lists.isEmpty(as)}">
            <td colspan="7">Nessun device assegnato</td>
        </tr>

        <!-- active assignments -->
        <tr th:each="a : ${as}">
            <td th:text="${a.device.id}">1</td>
            <td th:text="${a.device.origin}">Italy</td>
            <td th:text="${a.device.isConnected}">true</td>
            <td th:text="${a.device.isCalibrated}">true</td>
            <td th:text="${a.device.state}">ACTIVE</td>
            <td th:text="${a.device.price}">100.00</td>
            <td>
                <form th:action="@{/web/trackables/{trackableId}/devices/unbind(trackableId=${t.id},deviceId=${a.device.id})}"
                      method="post">
                    <button type="submit">Unbind</button>
                </form>
            </td>
        </tr>

        </tbody>
    </table>

    <!-- bind form -->
    <form th:action="@{/web/trackables/{trackableId}/devices/bind(trackableId=${t.id})}" method="post"
    style="margin-top:8px;">
        <label>
            <select name="deviceId" required>
                <option value="" disabled selected>Choose device...</option>
                <option th:each="d : ${availableDevices}"
                        th:value="${d.id}"
                        th:text="${d.id + ' - ' + d.origin + ' - ' + d.price}">
                </option>
            </select>
        </label>
        <button type="submit">Bind device</button>
    </form>

    <hr/>
</div>

</body>
</html>
